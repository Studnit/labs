<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Secure payment', ~{::section})}">
<body>
<section>
<div class="card mx-auto" style="max-width:480px"><div class="card-body p-4 text-center">
  <div class="avatar mx-auto mb-3" style="width:56px;height:56px;font-size:1.6rem"><i class="bi bi-shield-lock"></i></div>
  <h2 class="h5">Confirm payment</h2>
  <p class="text-muted" th:text="${payment.purpose}">Purpose</p>
  <div class="display-6 fw-bold mb-3" th:text="'₹' + ${payment.amount}">₹500</div>
  <div class="alert alert-warning small text-start">Development gateway: this simulates a successful card payment. Connect a real provider by implementing <code>PaymentGateway</code>.</div>
  <form th:action="@{/payments/{id}/gateway(id=${payment.id})}" method="post"><button class="btn btn-primary btn-lg w-100">Pay now</button></form>
  <a class="btn btn-link mt-2" th:href="@{/payments}">Cancel</a>
</div></div>
</section>
</body>
</html>
