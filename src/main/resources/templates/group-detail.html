<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Study group', ~{::section})}">
<body>
<section>
<div class="mb-3"><a th:href="@{/groups}" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> All groups</a></div>
<div class="card mb-3"><div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
  <div><h2 class="h4 mb-1" th:text="${group.name}">Group</h2><p class="text-muted mb-0" th:text="${group.description}">desc</p></div>
  <div class="d-flex gap-2">
    <a class="btn btn-primary" th:if="${isMember and @features.on('CHAT') and group.chatRoom != null}" th:href="@{/chat(room=${group.chatRoom.id})}"><i class="bi bi-chat-dots me-1"></i>Group chat</a>
    <form th:unless="${isMember}" th:action="@{/groups/{id}/join(id=${group.id})}" method="post"><button class="btn btn-primary">Join group</button></form>
    <form th:if="${isMember and group.owner.id != @ctx.id()}" th:action="@{/groups/{id}/leave(id=${group.id})}" method="post" data-confirm="Leave this group?"><button class="btn btn-outline-danger">Leave</button></form></div></div></div>
<div class="row g-3">
  <div class="col-lg-8"><div class="card"><div class="card-header">Shared materials</div>
    <div class="card-body border-bottom" th:if="${isMember}"><form class="row g-2" th:action="@{/groups/{id}/materials(id=${group.id})}" method="post" enctype="multipart/form-data">
      <div class="col-md-4"><input name="title" class="form-control" placeholder="Title (optional)" maxlength="150" aria-label="Title"></div>
      <div class="col-md-5"><input type="file" name="file" class="form-control" required aria-label="File"></div>
      <div class="col-md-3 d-grid"><button class="btn btn-primary"><i class="bi bi-upload me-1"></i>Share</button></div>
      <div class="form-text">PDF, Office docs, text, zip or images up to 10 MB.</div></form></div>
    <ul class="list-group list-group-flush">
      <li class="list-group-item d-flex justify-content-between align-items-center gap-2" th:each="m : ${materials}">
        <div class="min-w-0"><div class="fw-semibold text-truncate" th:text="${m.title}">title</div><div class="small text-muted" th:text="${m.uploader.fullName} + ' · ' + ${#temporals.format(m.createdAt,'dd MMM yyyy')} + ' · ' + ${m.sizeBytes / 1024} + ' KB'">meta</div></div>
        <div class="d-flex gap-1" th:if="${isMember or @ctx.staff()}"><a class="btn btn-sm btn-outline-primary" th:href="@{/groups/materials/{id}(id=${m.id})}"><i class="bi bi-download"></i></a>
          <form th:if="${@ctx.staff() or m.uploader.id == @ctx.id()}" th:action="@{/groups/materials/{id}/delete(id=${m.id})}" method="post" data-confirm="Delete this file?"><input type="hidden" name="groupId" th:value="${group.id}"><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form></div></li>
      <li class="list-group-item" th:if="${materials.isEmpty()}"><div th:replace="~{fragments/components :: empty('No materials shared yet','bi-folder2-open')}"></div></li></ul></div></div>
  <div class="col-lg-4"><div class="card"><div class="card-header">Members <span class="badge text-bg-secondary" th:text="${members.size()}">0</span></div><ul class="list-group list-group-flush">
    <li class="list-group-item d-flex align-items-center gap-2" th:each="m : ${members}"><span th:replace="~{fragments/components :: avatar(${m.user.fullName})}"></span><span th:text="${m.user.fullName}">n</span>
      <span class="badge text-bg-light ms-auto" th:if="${m.user.id == group.owner.id}">Owner</span></li></ul></div></div>
</div>
</section>
</body>
</html>
