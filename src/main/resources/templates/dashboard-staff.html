<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Dashboard', ~{::section})}">
<body>
<section>
<div class="hero-banner mb-3">
 <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
  <div><div class="small opacity-75">Overview</div><h2 th:text="${@nav.libraryName()}">Library</h2><span class="pill mt-2"><i class="bi bi-person-circle"></i><span th:text="${@nav.userName()}">Name</span></span></div>
  <div class="d-flex gap-2 flex-wrap">
    <a class="btn btn-light text-primary fw-semibold" th:if="${@features.on('QR_ATTENDANCE')}" th:href="@{/attendance/qr}"><i class="bi bi-qr-code me-1"></i>Entrance QR</a>
    <a class="btn btn-outline-light" th:href="@{/members?status=PENDING}"><i class="bi bi-person-check me-1"></i>Approvals</a>
  </div>
 </div>
</div>

<div class="row g-3 mb-4">
  <div class="col-6 col-lg-3"><div th:replace="~{fragments/components :: statCard('Active members', ${stats.members}, 'bi-people', 'primary')}"></div></div>
  <div class="col-6 col-lg-3" th:if="${stats.pending gt 0}"><div th:replace="~{fragments/components :: statCard('Pending approval', ${stats.pending}, 'bi-hourglass-split', 'warning')}"></div></div>
  <th:block th:if="${stats.present != null}">
    <div class="col-6 col-lg-3"><div th:replace="~{fragments/components :: statCard('In library now', ${stats.present}, 'bi-door-open', 'success')}"></div></div>
    <div class="col-6 col-lg-3"><div th:replace="~{fragments/components :: statCard('Visits today', ${stats.visitsToday}, 'bi-activity', 'info')}"></div></div>
    <div class="col-6 col-lg-3"><div th:replace="~{fragments/components :: statCard('Member time today', ${stats.hoursToday}, 'bi-clock-history', 'primary')}"></div></div>
    <div class="col-6 col-lg-3"><div th:replace="~{fragments/components :: statCard('Member time this month', ${stats.hoursMonth}, 'bi-calendar-check', 'success')}"></div></div>
  </th:block>
  <th:block th:if="${stats.activeSubs != null}">
    <div class="col-6 col-lg-3"><div th:replace="~{fragments/components :: statCard('Active subscriptions', ${stats.activeSubs}, 'bi-card-checklist', 'success')}"></div></div>
    <div class="col-6 col-lg-3" th:if="${stats.expiring gt 0}"><div th:replace="~{fragments/components :: statCard('Expiring in 7 days', ${stats.expiring}, 'bi-alarm', 'warning')}"></div></div>
  </th:block>
  <th:block th:if="${stats.revenueToday != null}">
    <div class="col-6 col-lg-3"><div th:replace="~{fragments/components :: statCard('Revenue today', |₹${#numbers.formatDecimal(stats.revenueToday,1,'COMMA',2,'POINT')}|, 'bi-cash-coin', 'success')}"></div></div>
    <div class="col-6 col-lg-3"><div th:replace="~{fragments/components :: statCard('Revenue this month', |₹${#numbers.formatDecimal(stats.revenueMonth,1,'COMMA',2,'POINT')}|, 'bi-bar-chart', 'primary')}"></div></div>
    <div class="col-6 col-lg-3" th:if="${stats.pendingPayments gt 0}"><div th:replace="~{fragments/components :: statCard('Payments to verify', ${stats.pendingPayments}, 'bi-patch-question', 'danger')}"></div></div>
  </th:block>
  <th:block th:if="${stats.booksOut != null}">
    <div class="col-6 col-lg-3"><div th:replace="~{fragments/components :: statCard('Books issued', ${stats.booksOut}, 'bi-book', 'info')}"></div></div>
    <div class="col-6 col-lg-3" th:if="${stats.overdue gt 0}"><div th:replace="~{fragments/components :: statCard('Overdue books', ${stats.overdue}, 'bi-exclamation-circle', 'danger')}"></div></div>
  </th:block>
  <div class="col-6 col-lg-3" th:if="${stats.guestsToday != null and stats.guestsToday gt 0}"><div th:replace="~{fragments/components :: statCard('Guests today', ${stats.guestsToday}, 'bi-person-badge', 'secondary')}"></div></div>
  <div class="col-6 col-lg-3" th:if="${stats.openReports != null and stats.openReports gt 0}"><div th:replace="~{fragments/components :: statCard('Open reports', ${stats.openReports}, 'bi-flag', 'danger')}"></div></div>
</div>

<h3 class="h6 text-uppercase text-muted mb-2">All features</h3>
<div class="mb-4" th:replace="~{fragments/components :: featureTiles}"></div>

<div class="row g-3">
  <div class="col-lg-7" th:if="${stats.chartLabels != null}">
    <div class="card h-100"><div class="card-header">Visits — last 7 days</div>
      <div class="card-body"><canvas id="visitsChart" height="130"></canvas></div></div>
  </div>
  <div class="col-lg-5">
    <div class="card h-100"><div class="card-header d-flex justify-content-between"><span>Announcements</span><a th:href="@{/announcements}" class="small">View all</a></div>
      <div class="list-group list-group-flush">
        <div class="list-group-item" th:each="a : ${announcements}">
          <div class="fw-semibold"><i class="bi bi-pin-angle-fill text-warning me-1" th:if="${a.pinned}"></i><span th:text="${a.title}">Title</span></div>
          <div class="small text-muted" th:text="${#temporals.format(a.createdAt,'dd MMM yyyy')}">date</div>
        </div>
        <th:block th:if="${announcements.isEmpty()}"><div th:replace="~{fragments/components :: empty('No announcements yet','bi-megaphone')}"></div></th:block>
      </div></div>
  </div>
</div>

<th:block th:if="${stats.chartLabels != null}">
<script th:src="@{/webjars/chart.js/4.4.3/dist/chart.umd.js}"></script>
<script th:inline="javascript">
  new Chart(document.getElementById('visitsChart'), {
    type: 'bar',
    data: { labels: /*[[${stats.chartLabels}]]*/ [], datasets: [{ label: 'Visits', data: /*[[${stats.chartValues}]]*/ [], backgroundColor: '#8b5cf6', borderRadius: 6 }] },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
  });
</script>
</th:block>
</section>
</body>
</html>
