<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Attendance', ~{::section})}">
<body>
<section>
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <div><h2 class="page-title">My attendance</h2></div>
  <a class="btn btn-primary" th:href="@{/attendance/scanner}"><i class="bi bi-camera me-1"></i>Scan to check in/out</a>
</div>
<div class="card mb-3" th:if="${open != null}"><div class="card-body d-flex align-items-center gap-3">
  <div class="icon tone-success p-3 rounded-3"><i class="bi bi-door-open fs-3"></i></div>
  <div><div class="h5 mb-0">You are checked in</div><div class="text-muted" th:text="'Since ' + ${#temporals.format(open.checkIn,'dd MMM HH:mm')}">since</div></div></div></div>
<div class="row g-3 mb-3">
  <div class="col-6 col-lg-3"><div th:replace="~{fragments/components :: statCard('Time in library today', ${timeStats.today()}, 'bi-clock-history', 'info')}"></div></div>
  <div class="col-6 col-lg-3"><div th:replace="~{fragments/components :: statCard('Time in library this month', ${timeStats.month()}, 'bi-calendar-check', 'primary')}"></div></div>
  <div class="col-6 col-lg-3"><div th:replace="~{fragments/components :: statCard('Days attended this month', ${timeStats.daysAttended()}, 'bi-calendar2-week', 'success')}"></div></div>
  <div class="col-6 col-lg-3"><div th:replace="~{fragments/components :: statCard('Average per day attended', ${timeStats.average()}, 'bi-speedometer', 'warning')}"></div></div>
</div>
<div class="card"><div class="card-header">History</div><div class="table-responsive"><table class="table mb-0">
  <thead><tr><th>Date</th><th>In</th><th>Out</th><th>Duration</th><th class="d-none d-sm-table-cell">Method</th></tr></thead><tbody>
  <tr th:each="a : ${history}"><td th:text="${#temporals.format(a.checkIn,'dd MMM yyyy')}">d</td><td th:text="${#temporals.format(a.checkIn,'HH:mm')}">in</td>
    <td th:text="${a.checkOut != null} ? ${#temporals.format(a.checkOut,'HH:mm')} : '—'">out</td>
    <td th:text="${a.minutes() / 60} + 'h ' + ${a.minutes() % 60} + 'm'">0</td><td class="d-none d-sm-table-cell" th:text="${a.method}">QR</td></tr>
  <tr th:if="${history.isEmpty()}"><td colspan="5"><div th:replace="~{fragments/components :: empty('No visits yet','bi-clock-history')}"></div></td></tr></tbody></table></div></div>
</section>
</body>
</html>
