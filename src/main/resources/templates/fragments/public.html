<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="shell(pageTitle, content)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle} + ' · Smart Library'">Smart Library</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <th:block th:replace="${content}"></th:block>
  <div class="text-center py-3 small" style="position:relative">
    <div th:replace="~{fragments/components :: langSwitch(false)}"></div>
    <div class="text-muted mt-2">&copy; 2026 Smart Library</div>
  </div>
  <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/app.js}"></script>
</body>
</html>
