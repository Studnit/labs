<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Library settings', ~{::section})}">
<body>
<section>
<div class="mb-3"><h2 class="page-title">Library settings</h2></div>
<div class="card" style="max-width:820px"><div class="card-body"><form th:action="@{/admin/library}" method="post"><div class="row g-3">
  <div class="col-md-6"><label class="form-label" for="s-name">Library name</label><input id="s-name" name="name" class="form-control" th:value="${lib.name}" required maxlength="120"></div>
  <div class="col-md-6"><label class="form-label" for="s-addr">Address</label><input id="s-addr" name="address" class="form-control" th:value="${lib.address}" maxlength="255"></div>
  <div class="col-md-4"><label class="form-label" for="s-phone">Phone</label><input id="s-phone" name="phone" class="form-control" th:value="${lib.phone}" maxlength="20"></div>
  <div class="col-md-4"><label class="form-label" for="s-email">Email</label><input id="s-email" name="email" type="email" class="form-control" th:value="${lib.email}"></div>
  <div class="col-md-4"><label class="form-label" for="s-upi">UPI ID</label><input id="s-upi" name="upiId" class="form-control" th:value="${lib.upiId}" placeholder="library@upi" maxlength="100"></div>
  <div class="col-6 col-md-3"><label class="form-label" for="s-open">Opens</label><input id="s-open" name="openTime" type="time" class="form-control" th:value="${lib.openTime}" required></div>
  <div class="col-6 col-md-3"><label class="form-label" for="s-close">Closes</label><input id="s-close" name="closeTime" type="time" class="form-control" th:value="${lib.closeTime}" required></div>
  <div class="col-6 col-md-3"><label class="form-label" for="s-fine">Fine / day (₹)</label><input id="s-fine" name="finePerDay" type="number" min="0" step="0.01" class="form-control" th:value="${lib.finePerDay}" required></div>
  <div class="col-6 col-md-3"><label class="form-label" for="s-days">Loan days</label><input id="s-days" name="maxIssueDays" type="number" min="1" max="90" class="form-control" th:value="${lib.maxIssueDays}" required></div>
  <div class="col-12"><label class="form-label" for="s-tag">Tagline</label><input id="s-tag" name="tagline" class="form-control" th:value="${lib.tagline}" maxlength="255"></div>
  <div class="col-12"><label class="form-label" for="s-fac">Facilities (one per line)</label><textarea id="s-fac" name="facilities" class="form-control" rows="5" maxlength="1000" th:text="${lib.facilities}"></textarea></div>
  <div class="col-12"><div class="small text-muted mb-2">Visitor registration link: <code th:text="'/g/' + ${lib.slug}">/g/slug</code></div><button class="btn btn-primary">Save settings</button></div>
</div></form></div></div>
</section>
</body>
</html>
