<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Modules', ~{::section})}">
<body>
<section>
<div class="mb-3"><h2 class="page-title">Library modules</h2><p class="page-sub">Turn features on or off for your library. Disabled modules disappear from the interface and their pages and APIs stop working immediately.</p></div>
<div class="row g-3">
  <div class="col-md-6 col-xl-4" th:each="f : ${flags}"><div class="card h-100" th:classappend="${f.value} ? 'border-success-subtle'"><div class="card-body d-flex gap-3">
    <div class="avatar" style="width:46px;height:46px;font-size:1.3rem"><i class="bi" th:classappend="${f.key.icon}"></i></div>
    <div class="flex-grow-1"><div class="d-flex justify-content-between align-items-start gap-2"><h3 class="h6 mb-1" th:text="${f.key.label}">Module</h3>
      <form th:action="@{/admin/features/{f}(f=${f.key.name()})}" method="post"><input type="hidden" name="enabled" th:value="${!f.value}">
        <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" role="switch" th:id="'sw-' + ${f.key.name()}" th:checked="${f.value}" onchange="this.form.submit()" th:attr="aria-label=${f.key.label}"></div></form></div>
      <p class="text-muted small mb-0" th:text="${f.key.description}">desc</p>
      <span class="badge mt-2" th:classappend="${f.value} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${f.value} ? 'Enabled' : 'Disabled'">state</span></div></div></div></div>
</div>
</section>
</body>
</html>
