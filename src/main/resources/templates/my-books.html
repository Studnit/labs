<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('My books', ~{::section})}">
<body>
<section>
<div class="mb-3"><a th:href="@{/books}" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Catalogue</a><h2 class="page-title mt-1">My books</h2></div>
<div class="card"><div class="table-responsive"><table class="table mb-0">
  <thead><tr><th>Book</th><th>Issued</th><th>Due</th><th>Returned</th><th>Fine</th></tr></thead><tbody>
  <tr th:each="i : ${issues}"><td th:text="${i.book.title}">b</td><td th:text="${i.issuedAt}">d</td>
    <td th:text="${i.dueDate}" th:classappend="${i.overdue} ? 'text-danger fw-semibold'">due</td><td th:text="${i.returnedAt != null} ? ${i.returnedAt} : '—'">r</td><td th:text="${i.fine}">0</td></tr>
  <tr th:if="${issues.isEmpty()}"><td colspan="5"><div th:replace="~{fragments/components :: empty('You have not borrowed any books','bi-book')}"></div></td></tr></tbody></table></div></div>
</section>
</body>
</html>
