<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/public :: shell('Error', ~{::section})}">
<body>
<section>
<div class="auth-wrap"><div class="card auth-card text-center">
  <div class="fs-1 text-muted"><i class="bi bi-emoji-frown"></i></div>
  <h1 class="h4 mt-2" th:text="${status == 404} ? 'Page not found' : (${status == 403} ? 'Access denied' : 'Something went wrong')">Error</h1>
  <p class="text-muted" th:text="${status == 404} ? 'The page you are looking for does not exist.' : (${status == 403} ? 'You do not have permission to view this page.' : 'Please try again in a moment.')"></p>
  <a class="btn btn-primary" th:href="@{/dashboard}">Back to dashboard</a>
</div></div>
</section>
</body>
</html>
