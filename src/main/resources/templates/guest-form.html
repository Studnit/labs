<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/public :: shell('Visitor check-in', ~{::section})}">
<body>
<section>
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="text-center mb-3">
      <div class="avatar mx-auto mb-2" style="width:52px;height:52px;font-size:1.5rem"><i class="bi bi-person-badge"></i></div>
      <h1 class="h4 fw-bold mb-0" th:text="${lib.name}">Library</h1>
      <p class="text-muted">Visitor check-in</p>
    </div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form th:action="@{/g/{s}(s=${lib.slug})}" method="post">
      <div class="mb-3"><label class="form-label" for="name">Your name *</label><input id="name" name="name" class="form-control form-control-lg" maxlength="100" required></div>
      <div class="row g-3 mb-3">
        <div class="col-6"><label class="form-label" for="phone">Phone</label><input id="phone" name="phone" class="form-control" maxlength="20" inputmode="tel"></div>
        <div class="col-6"><label class="form-label" for="email">Email</label><input id="email" name="email" type="email" class="form-control" maxlength="150"></div>
      </div>
      <div class="mb-3"><label class="form-label" for="purpose">Purpose of visit</label><input id="purpose" name="purpose" class="form-control" maxlength="200" placeholder="Reading, enquiry, tour…"></div>
      <div class="mb-3"><label class="form-label" for="visiting">Whom are you visiting? (optional)</label><input id="visiting" name="visiting" class="form-control" maxlength="100"></div>
      <button class="btn btn-primary btn-lg w-100">Check in</button>
    </form>
  </div>
</div>
</section>
</body>
</html>
