<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Attendance', ~{::section})}">
<body>
<section>
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <div><h2 class="page-title">Attendance</h2><p class="page-sub">Who is in the library right now, and today's visits.</p></div>
  <div class="d-flex gap-2"><a class="btn btn-primary" th:href="@{/attendance/qr}"><i class="bi bi-qr-code me-1"></i>Entrance QR</a>
    <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#manualIn"><i class="bi bi-pencil-square me-1"></i>Manual check-in</button></div>
</div>
<div class="row g-3">
  <div class="col-lg-5"><div class="card h-100"><div class="card-header d-flex justify-content-between"><span>In library now</span><span class="badge text-bg-success" th:text="${present.size()}">0</span></div>
    <ul class="list-group list-group-flush">
      <li class="list-group-item d-flex justify-content-between align-items-center gap-2" th:each="a : ${present}">
        <div><div class="fw-semibold" th:text="${a.user.fullName}">Name</div><div class="small text-muted" th:text="'Since ' + ${#temporals.format(a.checkIn,'HH:mm')} + ' · ' + ${a.method}">since</div></div>
        <form th:action="@{/attendance/manual/out/{id}(id=${a.id})}" method="post"><button class="btn btn-sm btn-outline-danger">Check out</button></form></li>
      <li class="list-group-item" th:if="${present.isEmpty()}"><div th:replace="~{fragments/components :: empty('Nobody is checked in','bi-door-closed')}"></div></li>
    </ul></div></div>
  <div class="col-lg-7"><div class="card h-100"><div class="card-header">Today's log</div><div class="table-responsive"><table class="table mb-0">
    <thead><tr><th>Member</th><th>In</th><th>Out</th><th class="d-none d-sm-table-cell">Minutes</th><th>Method</th></tr></thead><tbody>
    <tr th:each="a : ${today}"><td th:text="${a.user.fullName}">n</td><td th:text="${#temporals.format(a.checkIn,'HH:mm')}">in</td>
      <td th:text="${a.checkOut != null} ? ${#temporals.format(a.checkOut,'HH:mm')} : '—'">out</td><td class="d-none d-sm-table-cell" th:text="${a.minutes()}">0</td><td><span class="badge text-bg-light" th:text="${a.method}">QR</span></td></tr>
    <tr th:if="${today.isEmpty()}"><td colspan="5"><div th:replace="~{fragments/components :: empty('No visits today','bi-clock-history')}"></div></td></tr></tbody></table></div></div></div>
</div>
<div class="modal fade" id="manualIn" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered">
  <form class="modal-content" th:action="@{/attendance/manual/in}" method="post">
    <div class="modal-header"><h5 class="modal-title">Manual check-in</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="mb-3"><label class="form-label" for="mi-user">Member</label><select id="mi-user" name="userId" class="form-select" required>
        <option value="">Choose…</option><option th:each="m : ${members}" th:value="${m.id}" th:text="${m.fullName} + (${m.memberCode != null} ? ' (' + ${m.memberCode} + ')' : '')">Member</option></select></div>
      <div class="mb-3"><label class="form-label" for="mi-at">Time (leave empty for now)</label><input id="mi-at" name="at" type="datetime-local" class="form-control"></div>
      <div><label class="form-label" for="mi-note">Note</label><input id="mi-note" name="note" class="form-control" maxlength="200" placeholder="e.g. forgot phone"></div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Check in</button></div>
  </form></div></div>
</section>
</body>
</html>
