# Production-style stack: app + PostgreSQL (+ optional TLS reverse proxy is expected in front, e.g. Caddy/nginx/Traefik).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartlib
      POSTGRES_USER: smartlib
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlib -d smartlib"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/smartlib
      DB_USER: smartlib
      DB_PASSWORD: ${DB_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL, e.g. https://library.example.com}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?set SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?set SUPERADMIN_PASSWORD}
      LIBRARY_ADMIN_EMAIL: ${LIBRARY_ADMIN_EMAIL:-}
      LIBRARY_ADMIN_PASSWORD: ${LIBRARY_ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      GATEWAY_MOCK: ${GATEWAY_MOCK:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
